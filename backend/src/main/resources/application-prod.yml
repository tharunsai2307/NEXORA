# =============================================================================
# Production Spring Boot Configuration Profile (prod)
# NEXORA — Smart Building Safety & Occupancy Digital Twin Platform
# =============================================================================

server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:smart_building_db}
    username: ${DB_USER:smart_admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      pool-name: NexoraProductionHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

ai-service:
  base-url: ${AI_SERVICE_URL:http://ai-service:8000}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1}
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  allowed-headers:
    - "*"
  allow-credentials: true

logging:
  level:
    root: INFO
    com.smartbuilding: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.apache.coyote.http11: WARN
